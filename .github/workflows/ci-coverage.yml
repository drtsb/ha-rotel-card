name: CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "main"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run coverage

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "Coverage summary file not found"
            exit 1
          fi
          PCT=$(jq -r '.total.statements.pct // .total.lines.pct // 0' "$COVERAGE_FILE")
          echo "Coverage: ${PCT}%"
          echo "pct=$PCT" >> $GITHUB_OUTPUT

      - name: Determine badge color
        id: color
        env:
          PCT: ${{ steps.coverage.outputs.pct }}
        run: |
          if awk "BEGIN {exit !($PCT > 80)}"; then
            COLOR="brightgreen"
          elif awk "BEGIN {exit !($PCT > 50)}"; then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Update coverage badge Gist
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: rotel-card-coverage.json
          label: Coverage
          message: "${{ steps.coverage.outputs.pct }}%"
          color: ${{ steps.color.outputs.color }}
