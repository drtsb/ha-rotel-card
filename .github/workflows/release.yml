name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and attach rotel-card.js to release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build production bundle
        run: npm run build --if-present

      - name: Verify rotel-card.js exists
        run: |
          if [ -f "rotel-card.js" ]; then
            echo "Found rotel-card.js in repo root"
            FILE="rotel-card.js"
          elif [ -f "dist/rotel-card.js" ]; then
            echo "Found rotel-card.js in dist/"
            cp dist/rotel-card.js ./rotel-card.js
            FILE="rotel-card.js"
          else
            echo "::error::rotel-card.js not found after build. Ensure build outputs rotel-card.js to root or dist/."
            find . -maxdepth 4 -name 'rotel-card.js' -o -name '*.js' | grep -E '(rotel|card)' || true
            exit 1
          fi
          ls -lh "$FILE"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rotel-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
